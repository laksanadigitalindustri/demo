<!DOCTYPE html>

<html class="light" lang="id"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login | Laksanasoft Corporate Banking</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "secondary-fixed": "#c6e7ff",
                    "surface-container-high": "#e6e8ea",
                    "surface-tint": "#3a5f94",
                    "tertiary-fixed-dim": "#b7c8e1",
                    "surface-container-highest": "#e0e3e5",
                    "on-tertiary": "#ffffff",
                    "on-primary": "#ffffff",
                    "on-tertiary-fixed": "#0b1c30",
                    "secondary-fixed-dim": "#81cfff",
                    "on-secondary": "#ffffff",
                    "tertiary-fixed": "#d3e4fe",
                    "outline-variant": "#c3c6d1",
                    "outline": "#737780",
                    "primary-fixed-dim": "#a7c8ff",
                    "primary": "#001e40",
                    "surface-container": "#eceef0",
                    "surface-container-low": "#f2f4f6",
                    "on-surface": "#191c1e",
                    "surface-bright": "#f7f9fb",
                    "on-primary-fixed-variant": "#1f477b",
                    "on-tertiary-fixed-variant": "#38485d",
                    "primary-container": "#003366",
                    "background": "#f7f9fb",
                    "on-primary-fixed": "#001b3c",
                    "secondary-container": "#41befd",
                    "inverse-surface": "#2d3133",
                    "surface-container-lowest": "#ffffff",
                    "surface-variant": "#e0e3e5",
                    "secondary": "#00658d",
                    "on-primary-container": "#799dd6",
                    "primary-fixed": "#d5e3ff",
                    "tertiary": "#0e1f32",
                    "tertiary-container": "#243448",
                    "inverse-primary": "#a7c8ff",
                    "on-secondary-fixed-variant": "#004c6b",
                    "on-tertiary-container": "#8c9cb5",
                    "on-error-container": "#93000a",
                    "error": "#ba1a1a",
                    "surface": "#f7f9fb",
                    "error-container": "#ffdad6",
                    "inverse-on-surface": "#eff1f3",
                    "on-secondary-fixed": "#001e2d",
                    "on-background": "#191c1e",
                    "surface-dim": "#d8dadc",
                    "on-secondary-container": "#004b69",
                    "on-surface-variant": "#43474f",
                    "on-error": "#ffffff"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "card-padding": "1rem",
                    "stack-gap": "0.75rem",
                    "container-margin": "1rem",
                    "section-gap": "1.5rem",
                    "inline-gutter": "0.5rem"
            },
            "fontFamily": {
                    "body-lg": ["Inter"],
                    "label-md": ["Inter"],
                    "headline-lg": ["Inter"],
                    "headline-md": ["Inter"],
                    "body-md": ["Inter"],
                    "headline-lg-mobile": ["Inter"]
            },
            "fontSize": {
                    "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                    "headline-lg": ["28px", {"lineHeight": "34px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "headline-md": ["20px", {"lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                    "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                    "headline-lg-mobile": ["24px", {"lineHeight": "30px", "fontWeight": "700"}]
            }
          },
        },
      }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7f9fb;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .login-card {
            box-shadow: 0px 4px 20px rgba(0, 0, 0, 0.05);
        }
        .bg-mesh {
            background-color: #f7f9fb;
            background-image: 
                radial-gradient(at 0% 0%, rgba(0, 30, 64, 0.03) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(65, 190, 253, 0.05) 0px, transparent 50%);
        }
    </style>
</head>
<body class="bg-mesh min-h-screen flex flex-col items-center justify-center px-container-margin">
<div class="w-full max-w-md flex flex-col items-center">
<!-- Logo Brand -->
<div class="mb-12 text-center">
<div class="flex items-center justify-center space-x-2 mb-2">
<div class="w-10 h-10 bg-primary-container rounded-lg flex items-center justify-center">
<span class="material-symbols-outlined text-on-primary-container text-3xl" style="font-variation-settings: 'FILL' 1;">account_balance</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-primary tracking-tight">Laksanasoft</h1>
</div>
<p class="font-label-md text-label-md text-outline tracking-wider">CORPORATE BANKING</p>
</div>
<!-- Login Container -->
<div class="w-full bg-surface-container-lowest rounded-xl p-8 login-card border border-surface-container-high transition-all duration-300">
<div class="mb-8">
<h2 class="font-headline-md text-headline-md text-primary mb-1">Selamat Datang</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Silakan masuk ke akun institusi Anda.</p>
</div>
<form action="#" class="space-y-6" id="loginForm">
<!-- Username Field -->
<div class="space-y-1.5">
<label class="font-label-md text-label-md text-on-surface ml-1" for="username">Username atau Email</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline group-focus-within:text-secondary transition-colors">person</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 font-body-md text-body-md bg-surface-bright border border-outline-variant rounded-lg focus:outline-none focus:ring-0 focus:border-secondary transition-all" id="username" name="username" placeholder="Masukkan username" required="" type="text"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-1.5">
<div class="flex justify-between items-center px-1">
<label class="font-label-md text-label-md text-on-surface" for="password">Kata Sandi</label>
<a class="font-label-md text-label-md text-secondary hover:underline" href="#">Lupa Password?</a>
</div>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline group-focus-within:text-secondary transition-colors">lock</span>
</div>
<input class="block w-full pl-10 pr-12 py-3 font-body-md text-body-md bg-surface-bright border border-outline-variant rounded-lg focus:outline-none focus:ring-0 focus:border-secondary transition-all" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute inset-y-0 right-0 pr-3 flex items-center text-outline hover:text-on-surface-variant" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined" id="eyeIcon">visibility</span>
</button>
</div>
</div>
<!-- Action Button -->
<button class="w-full bg-primary hover:bg-primary-container text-on-primary font-headline-md text-body-lg py-4 rounded-lg shadow-lg active:scale-[0.98] transition-all flex items-center justify-center space-x-2" type="submit">
<span>Masuk</span>
</button>
<!-- Biometric Section -->
<div class="relative py-4 flex items-center">
<div class="flex-grow border-t border-outline-variant"></div>
<span class="flex-shrink mx-4 font-label-md text-label-md text-outline">ATAU MASUK DENGAN</span>
<div class="flex-grow border-t border-outline-variant"></div>
</div>
<div class="flex justify-center space-x-4">
<button class="flex flex-col items-center justify-center w-20 h-20 bg-surface-bright border border-outline-variant rounded-xl hover:border-secondary hover:bg-secondary-fixed transition-all group" type="button">
<span class="material-symbols-outlined text-primary text-3xl group-hover:scale-110 transition-transform">fingerprint</span>
<span class="font-label-md text-[10px] mt-1 text-on-surface-variant">TouchID</span>
</button>
<button class="flex flex-col items-center justify-center w-20 h-20 bg-surface-bright border border-outline-variant rounded-xl hover:border-secondary hover:bg-secondary-fixed transition-all group" type="button">
<span class="material-symbols-outlined text-primary text-3xl group-hover:scale-110 transition-transform">drafts</span>
<span class="font-label-md text-[10px] mt-1 text-on-surface-variant">FaceID</span>
</button>
</div>
</form>
</div>
<!-- Footer Info -->
<div class="mt-8 text-center space-y-4">
<p class="font-body-md text-body-md text-on-surface-variant">
                Belum punya akun? <a class="text-primary font-semibold hover:underline" href="#">Hubungi Admin</a>
</p>
<div class="flex items-center justify-center space-x-2 text-outline">
<span class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' 1;">verified_user</span>
<span class="font-label-md text-[11px] uppercase tracking-widest">Secure 256-bit AES Encryption</span>
</div>
</div>
</div>
<!-- Background Decorative Element -->
<div class="fixed bottom-0 left-0 w-full opacity-10 pointer-events-none">
<div class="h-1 bg-gradient-to-r from-primary via-secondary to-primary-container w-full"></div>
</div>
<script>
        function togglePassword() {
            const passwordField = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');
            if (passwordField.type === 'password') {
                passwordField.type = 'text';
                eyeIcon.textContent = 'visibility_off';
            } else {
                passwordField.type = 'password';
                eyeIcon.textContent = 'visibility';
            }
        }

        // Simple button interaction
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('mousedown', () => {
                btn.style.transform = 'scale(0.97)';
            });
            btn.addEventListener('mouseup', () => {
                btn.style.transform = '';
            });
            btn.addEventListener('mouseleave', () => {
                btn.style.transform = '';
            });
        });

        // Form submission micro-interaction
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            const originalContent = btn.innerHTML;
            btn.innerHTML = `<span class="inline-block animate-spin rounded-full h-5 w-5 border-2 border-white border-t-transparent mr-2"></span> Memproses...`;
            btn.disabled = true;
            
            setTimeout(() => {
                btn.innerHTML = `<span class="material-symbols-outlined">check_circle</span>`;
                btn.classList.replace('bg-primary', 'bg-green-600');
                setTimeout(() => {
                    alert('Login simulasi berhasil (Demo Interface)');
                    btn.innerHTML = originalContent;
                    btn.classList.replace('bg-green-600', 'bg-primary');
                    btn.disabled = false;
                }, 1000);
            }, 1500);
        });
    </script>
</body></html>
