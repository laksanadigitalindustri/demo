<script>
        // Simple micro-interaction for the biometric toggle
        const toggle = document.querySelector('.bg-secondary-container');
        if (toggle) {
            toggle.addEventListener('click', () => {
                const knob = toggle.querySelector('div');
                const status = toggle.closest('button').querySelector('.text-label-md');
                if (knob.classList.contains('right-1')) {
                    knob.classList.replace('right-1', 'left-1');
                    toggle.classList.replace('bg-secondary-container', 'bg-outline-variant');
                    status.textContent = 'Nonaktif';
                } else {
                    knob.classList.replace('left-1', 'right-1');
                    toggle.classList.replace('bg-outline-variant', 'bg-secondary-container');
                    status.textContent = 'Aktif';
                }
            });
        }
    </script>
